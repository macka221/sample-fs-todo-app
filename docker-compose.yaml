services:
  db:
    image: postgres:16-alpine
    container_name: todo-db
    environment:
      # Hardcoded credentials for local development only - never use in prod.
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: todo
    ports:
      - "5432:5432"
    volumes:
      - todo-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d todo"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  todo-db-data:
